<!-- A SMIL spinner: the arc rotates once a second and the stroke colour cycles
     between primary and tertiary, both declared in the file itself. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<g transform="rotate(0 12 12)">
		<animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/>
		<path d="M12 3 a9 9 0 0 1 9 9" fill="none" stroke="#6750a4" stroke-width="3" stroke-linecap="round">
			<animate attributeName="stroke" from="#6750a4" to="#7d5260" dur="1.5s" repeatCount="indefinite"/>
		</path>
	</g>
	<circle cx="12" cy="12" r="2" fill="#6750a4"/>
</svg>
