# Application name and id, used by goi build and packaging.
name: terminal
id: com.example.terminal

# Build tags passed to goi run. nofakecgo and CGO_ENABLED=0 are always
# used; all turns on every optional feature. The pty has one reader, so the
# watcher stays off and a reload cannot open a second one.
runFlags: [all, nohotreload]

# Build tags passed to goi build; auto adds only what the design uses.
buildFlags: [auto, nohotreload]

# Where LoadWindow finds the design files and their assets.
assets: assets

# Directory goi run and goi build execute.
entrypoint: cmd
