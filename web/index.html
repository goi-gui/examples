<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goi counter</title>
<style>
	html, body { margin: 0; height: 100%; background: #f6f3fb; }
	/* The canvas is the window: the app follows this box. */
	body { display: grid; place-items: center; }
	#goi-app {
		width: min(100vw, 480px);
		height: min(100vh, 400px);
	}
	/* The app draws its own focus; a browser outline around the canvas only
	   shows up as a purple border after the first click. */
	#goi-app:focus, #goi-app:focus-visible { outline: none; }

	/* The wasm download and first frame take a moment; cover the canvas until
	   the app dispatches goi-ready from its first presented frame. */
	#goi-loading {
		position: fixed;
		inset: 0;
		display: grid;
		place-items: center;
		background: #f6f3fb;
		transition: opacity .2s ease;
	}
	#goi-loading.done { opacity: 0; pointer-events: none; }
	.goi-spinner {
		width: 48px;
		height: 48px;
		border-radius: 50%;
		border: 4px solid #e8def8;
		border-top-color: #6750a4;
		animation: goi-spin .9s linear infinite;
	}
	@keyframes goi-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<!-- The app names this id with ui.WithCanvas("goi-app"), so a page can hold
     several canvases and run one app in each. -->
<div id="goi-loading" role="status" aria-live="polite" aria-label="Loading goi">
	<div class="goi-spinner" aria-hidden="true"></div>
</div>
<canvas id="goi-app"></canvas>
<script src="wasm_exec.js"></script>
<script>
	const canvas = document.getElementById("goi-app");
	const loading = document.getElementById("goi-loading");
	canvas.addEventListener("goi-ready", () => {
		loading.classList.add("done");
		loading.setAttribute("aria-hidden", "true");
	}, { once: true });

	const go = new Go();
	WebAssembly.instantiateStreaming(fetch("goi.wasm"), go.importObject).then((result) => {
		go.run(result.instance);
	});
</script>
</body>
</html>
